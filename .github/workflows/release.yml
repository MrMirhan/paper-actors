name: Release

# A push to main that changes the version in build.gradle publishes that version: the release creates its v<version> tag.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: The version in build.gradle, and whether it has a release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n "s/^version = '\(.*\)'/\1/p" build.gradle)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version is already released; nothing to do"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.new == 'true'
        run: ./gradlew build
      - if: steps.version.outputs.new == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: steps.version.outputs.new == 'true'
        run: python3 -m unittest discover -s client
      - name: Collect the release files
        if: steps.version.outputs.new == 'true'
        run: |
          mkdir dist
          cp build/libs/paper-actors-*.jar minestom/build/libs/minestom-actors-*.jar dist/
          rm -f dist/*-dev.jar dist/*-sources.jar
          cp client/actors_client.py dist/
          (cd dist && sha256sum * > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - name: Publish the release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$TAG" --generate-notes
