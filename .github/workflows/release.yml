name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: The tag matches the version in build.gradle
        run: |
          version=$(sed -n "s/^version = '\(.*\)'/\1/p" build.gradle)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in build.gradle" >&2
            exit 1
          fi
      - run: ./gradlew build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s client
      - name: Collect the release files
        run: |
          mkdir dist
          cp build/libs/paper-actors-*.jar dist/
          rm -f dist/*-dev.jar dist/*-sources.jar
          cp client/actors_client.py dist/
          (cd dist && sha256sum * > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
